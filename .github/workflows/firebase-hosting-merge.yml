name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - feature/firebase-hosting

# This project has no build step (it's a Python script, not an npm app), so
# this workflow does NOT run generate_map.py -- it deploys whatever is
# already committed in postal_code_map_output/ at push time. Run
# generate_map.py locally (or in Colab) first, and make sure its output is
# committed on this branch before pushing, or this step will fail/deploy
# stale content. See README.md's "Deploying to Firebase Hosting" section.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STONY_PLAIN_RD_COMPANIES_MAP }}"
          channelId: live
          projectId: stony-plain-rd-companies-map
